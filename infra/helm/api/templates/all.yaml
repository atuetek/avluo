apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace.name }}
---
{{- if .Values.secrets.databaseUrl }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "api.fullname" . }}-secret
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ .Values.secrets.databaseUrl | quote }}
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
  {{- if .Values.secrets.s3AccessKey }}
  s3-access-key: {{ .Values.secrets.s3AccessKey | quote }}
  s3-secret-key: {{ .Values.secrets.s3SecretKey | quote }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "api.fullname" . }}-config
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
data:
  redis-url: {{ .Values.config.redisUrl | quote }}
  app-base-url: {{ .Values.config.appBaseUrl | quote }}
  webauthn-rp-id: {{ .Values.config.webauthnRpId | quote }}
  webauthn-origin: {{ .Values.config.webauthnOrigin | quote }}
  default-tenant-id: {{ .Values.config.defaultTenantId | quote }}
  s3-endpoint: {{ .Values.config.s3Endpoint | quote }}
  media-public-base-url: {{ .Values.config.mediaPublicBaseUrl | quote }}
  cors-origin: {{ .Values.config.corsOrigin | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "api.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "api.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.imagePullSecrets.enabled }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecrets.secretName }}
      {{- end }}
      {{- if .Values.secrets.databaseUrl }}
      initContainers:
        - name: prisma-migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /app
          command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "api.fullname" . }}-secret
                  key: database-url
            - name: NODE_OPTIONS
              value: "--max-old-space-size=128"
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
          env:
            - name: NODE_ENV
              value: {{ .Values.environment | quote }}
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: NODE_OPTIONS
              value: {{ .Values.nodeOptions | default "--max-old-space-size=192" | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "api.fullname" . }}-secret
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "api.fullname" . }}-secret
                  key: jwt-secret
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "api.fullname" . }}-config
                  key: redis-url
            - name: APP_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "api.fullname" . }}-config
                  key: app-base-url
            - name: WEBAUTHN_RP_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ include "api.fullname" . }}-config
                  key: webauthn-rp-id
            - name: WEBAUTHN_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: {{ include "api.fullname" . }}-config
                  key: webauthn-origin
            - name: DEFAULT_TENANT_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ include "api.fullname" . }}-config
                  key: default-tenant-id
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "api.fullname" . }}-config
                  key: s3-endpoint
            - name: MEDIA_PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "api.fullname" . }}-config
                  key: media-public-base-url
            - name: S3_USE_SSL
              value: "true"
            {{- if .Values.secrets.s3AccessKey }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "api.fullname" . }}-secret
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "api.fullname" . }}-secret
                  key: s3-secret-key
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "api.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
  selector:
    {{- include "api.selectorLabels" . | nindent 4 }}
---
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "api.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "api.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
