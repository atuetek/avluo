# Apply once: kubectl apply -f infra/k8s/postgres-prod.yaml
# Prefer setting password via Secret in real prod.
---
apiVersion: v1
kind: Namespace
metadata:
  name: avluo-prod
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: avluo-prod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: avluo-prod
type: Opaque
stringData:
  POSTGRES_USER: avluo
  POSTGRES_PASSWORD: "CHANGE_ME_STRONG_PASSWORD"
  POSTGRES_DB: avluo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: avluo-prod
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          args:
            - "-c"
            - "shared_buffers=64MB"
            - "-c"
            - "effective_cache_size=128MB"
            - "-c"
            - "maintenance_work_mem=32MB"
            - "-c"
            - "work_mem=4MB"
            - "-c"
            - "max_connections=50"
            - "-c"
            - "wal_buffers=2MB"
            - "-c"
            - "checkpoint_completion_target=0.9"
            - "-c"
            - "random_page_cost=1.1"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "avluo"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "avluo"]
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: avluo-prod
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
